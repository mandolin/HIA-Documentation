name: Coordinate npm stable publication

on:
  workflow_call:
    inputs:
      release_revision:
        required: true
        type: string
      mode:
        required: true
        type: string
      package_name:
        required: false
        type: string
      confirmation:
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  stable:
    # <lang lang="zh-CN">隔离分支和默认分支的推送仅审计，发行只接收默认分支的显式调用。</lang><lang lang="en">Branch pushes only audit. Publication requires a main-branch dispatch.</lang>
    if: (inputs.mode == 'audit' && (github.ref == 'refs/heads/release/w-p157-stable-entry' || github.ref == 'refs/heads/main')) || (inputs.mode == 'publish' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable control revision
        env:
          REVISION: ${{ inputs.release_revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out fixed release control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: mandolin/HIA-Documentation
          ref: ${{ inputs.release_revision }}
          path: stable-control
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify release control
        run: node --test stable-control/scripts/npm-prerelease-candidate.test.mjs stable-control/scripts/publish-npm-candidate.test.mjs stable-control/scripts/npm-stable-preflight.test.mjs stable-control/scripts/publish-npm-stable.test.mjs
      - name: Read authorization from the control default branch
        if: inputs.mode == 'publish'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: mandolin/HIA-Documentation
          ref: refs/heads/main
          path: stable-authorization
          persist-credentials: false
      - name: Verify archive, Registry and owner authority
        env:
          STABLE_MODE: ${{ inputs.mode }}
          STABLE_PACKAGE: ${{ inputs.package_name }}
          STABLE_CONFIRMATION: ${{ inputs.confirmation }}
          STABLE_APPROVAL_FILE: stable-authorization/release/stable-authorization.json
          GH_TOKEN: ${{ github.token }}
        run: node stable-control/scripts/publish-npm-stable.mjs
