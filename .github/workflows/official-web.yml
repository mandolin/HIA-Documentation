name: Official website foundation

# 中文：只验证独立官网预览，不发布Pages或替换旧参考根。 English: validate the standalone preview without publishing Pages or replacing the reference root.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-official-web*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/official-web.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22.23.4, 24.22.1]
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual pages
        run: pnpm site:build
      - name: Check output and boundary regressions
        run: |
          pnpm site:check
          pnpm site:test
          pnpm site:licenses
          pnpm license:audit
