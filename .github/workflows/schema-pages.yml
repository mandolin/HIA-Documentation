name: HIA Reference Pages

on:
  push:
    branches:
      - main
  # 中文：每日重新构建并部署线上站点；只构建归档不能满足168小时发布年龄门禁。
  # English: Rebuild and deploy the live site daily; an artifact-only build cannot satisfy the 168-hour publication-age gate.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-reference-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public reference Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # 中文：构建使用 engines 声明的 Node.js 24 最低版本，避免 runner 缓存落在 24.21.0。
          # English: Build on the declared Node.js 24 floor rather than the runner's older 24.21.0 cache.
          node-version: 24.22.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm run release:gate

      - name: Create read-only source checkout token
        id: reference_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIA_REFERENCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIA_REFERENCE_APP_PRIVATE_KEY }}
          owner: mandolin

      - name: Check out hia-jsdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-jsdoc
          ref: main
          path: reference/sources/hia-jsdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-htmdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-htmdoc
          ref: main
          path: reference/sources/hia-htmdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-cssdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-cssdoc
          ref: main
          path: reference/sources/hia-cssdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-sassdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-sassdoc
          ref: main
          path: reference/sources/hia-sassdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-pugdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-pugdoc
          ref: main
          path: reference/sources/hia-pugdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-tsdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-tsdoc
          ref: main
          path: reference/sources/hia-tsdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-vuedoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-vuedoc
          ref: main
          path: reference/sources/hia-vuedoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      # 中文：复用JSDoc owner-sources已锁定的两个来源；不访问私有WorkZone或发布npm。
      # English: Reuse the two sources pinned by JSDoc owner-sources without accessing private WorkZone or publishing npm.
      - name: Check out pinned JSDoc plugin owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-plugin-hia-sys
          ref: 15970dc9da0f8e120677eab7eba3e959dcf42a34
          path: reference/sources/jsdoc-plugin-hia-sys
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out pinned JSDoc theme owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-theme-hia
          ref: 0df2ca9bbf40e159d8da69aac80b3c31136b1a05
          path: reference/sources/jsdoc-theme-hia
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Prepare pinned JSDoc owner archives
        working-directory: reference/sources/hia-jsdoc
        shell: pwsh
        run: npm run prepare:owners

      - name: Install selected source dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # 中文：安装集合来自既有七源声明，不把两个归档owner误当reference输入工程。
          # English: Install only the seven declared sources, never treating archive owners as reference input projects.
          $definition=Get-Content reference/public-reference-build.definition.json -Raw|ConvertFrom-Json
          foreach($source in $definition.sources|Where-Object {$_.workspace -eq 'source'}){
            Push-Location (Join-Path reference/sources $source.id)
            try{
              npm ci --ignore-scripts --no-audit --no-fund
              if($LASTEXITCODE){throw 'Selected reference source installation failed.'}
            }finally{Pop-Location}
          }

      - name: Build and verify public reference Pages artifact
        run: |
          pnpm run reference:build
          pnpm run reference:check
          pnpm run reference:portal:data:check
          pnpm run reference:pages
          pnpm run reference:portal:check
          pnpm run reference:pages:check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public reference Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/reference-pages
          include-hidden-files: true

  deploy:
    name: Deploy and verify public reference Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published reference Pages
        env:
          HIA_REFERENCE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-reference-pages-online.mjs
