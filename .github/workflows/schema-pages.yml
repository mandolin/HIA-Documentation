name: HIA Reference Pages

on:
  push:
    branches:
      - main
  # 中文：每日重新构建并部署线上站点；只构建归档不能满足168小时发布年龄门禁。
  # English: Rebuild and deploy the live site daily; an artifact-only build cannot satisfy the 168-hour publication-age gate.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-reference-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public reference Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # 中文：构建使用 engines 声明的 Node.js 24 最低版本，避免 runner 缓存落在 24.21.0。
          # English: Build on the declared Node.js 24 floor rather than the runner's older 24.21.0 cache.
          node-version: 24.22.1

      # 中文：编译唯一公开.NET样本并运行现有Roslyn来源工具。 English: Compile the first-party .NET sample and run the existing Roslyn source tool.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm run release:gate

      - name: Create read-only source checkout token
        id: reference_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIA_REFERENCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIA_REFERENCE_APP_PRIVATE_KEY }}
          owner: mandolin

      - name: Check out hia-jsdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-jsdoc
          ref: main
          path: reference/sources/hia-jsdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-htmdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-htmdoc
          ref: main
          path: reference/sources/hia-htmdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-cssdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-cssdoc
          ref: main
          path: reference/sources/hia-cssdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-sassdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-sassdoc
          ref: main
          path: reference/sources/hia-sassdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-pugdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-pugdoc
          ref: main
          path: reference/sources/hia-pugdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-tsdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-tsdoc
          ref: main
          path: reference/sources/hia-tsdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-dotnetdoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-dotnetdoc
          ref: main
          path: reference/sources/hia-dotnetdoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out hia-vuedoc
        uses: actions/checkout@v6
        with:
          repository: mandolin/hia-vuedoc
          ref: main
          path: reference/sources/hia-vuedoc
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      # 中文：复用JSDoc owner-sources已锁定的两个来源；不访问私有WorkZone或发布npm。
      # English: Reuse the two sources pinned by JSDoc owner-sources without accessing private WorkZone or publishing npm.
      - name: Check out pinned JSDoc plugin owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-plugin-hia-sys
          ref: 15970dc9da0f8e120677eab7eba3e959dcf42a34
          path: reference/sources/jsdoc-plugin-hia-sys
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Check out pinned JSDoc theme owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-theme-hia
          ref: ef3933b0f7a05961d2c88bf412996dfcae6098aa
          path: reference/sources/jsdoc-theme-hia
          token: ${{ steps.reference_app_token.outputs.token }}
          persist-credentials: false

      - name: Prepare pinned JSDoc owner archives
        working-directory: reference/sources/hia-jsdoc
        shell: pwsh
        run: npm run prepare:owners

      - name: Install selected source dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # 中文：安装集合来自既有八个卫星来源声明，不把两个归档owner误当reference输入工程。
          # English: Install only the eight declared satellite sources, never treating archive owners as reference input projects.
          $definition=Get-Content reference/public-reference-build.definition.json -Raw|ConvertFrom-Json
          foreach($source in $definition.sources|Where-Object {$_.workspace -eq 'source'}){
            Push-Location (Join-Path reference/sources $source.id)
            try{
              # 中文：将锁中既有镜像主机定向映射到npm官方源，继续校验原版本和integrity。
              # English: Map the existing mirror host to the official npm registry while verifying locked versions and integrity.
              npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com
              if($LASTEXITCODE){throw 'Selected reference source installation failed.'}
            }finally{Pop-Location}
          }

      - name: Build and verify public reference Pages artifact
        run: |
          pnpm run reference:build
          pnpm run reference:check
          pnpm run reference:portal:data:check
          pnpm run reference:pages
          pnpm run reference:portal:check
          pnpm run reference:pages:check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 中文：兼容发布器代码固定到已配对提交，实际快照由同一选定清单约束。
      # English: Pin the compatibility publisher to its paired revision and bind its snapshot through the same selected manifest.
      - name: Check out pinned compatibility publisher
        uses: actions/checkout@v6
        with:
          repository: mandolin/HIA-Documentation-Legacy
          ref: 348a477737260d10395cebaea27e77d9dcc6447b
          path: reference/sources/hia-legacy-publication
          persist-credentials: false

      - name: Verify recovery regressions
        run: python3 -m unittest discover -s scripts -p test_pages_recovery.py

      - name: Prepare paired compatibility artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $snapshot=Get-Content reference/legacy-reference.snapshot.json -Raw|ConvertFrom-Json
          if($snapshot.tag -notmatch '^reference-[0-9a-f]{7,40}$' -or $snapshot.asset -notmatch '^reference-pages-[0-9a-f]{7,40}\.tar\.gz$'){throw 'Invalid compatibility snapshot locator.'}
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';assert.deepEqual(JSON.parse(fs.readFileSync('reference/legacy-reference.snapshot.json')),JSON.parse(fs.readFileSync('reference/sources/hia-legacy-publication/snapshot.json')));"
          if($LASTEXITCODE){throw 'Compatibility selection differs from its pinned publisher.'}
          New-Item -ItemType Directory -Path dist -Force|Out-Null
          curl --fail --silent --show-error --location --proto '=https' --max-time 180 --output dist/legacy-reference.tar.gz "https://github.com/mandolin/HIA-Documentation-Legacy/releases/download/$($snapshot.tag)/$($snapshot.asset)"
          if($LASTEXITCODE){throw 'Compatibility archive download failed.'}
          python3 reference/sources/hia-legacy-publication/scripts/prepare.py reference/legacy-reference.snapshot.json dist/legacy-reference.tar.gz dist/legacy-reference-pinned
          if($LASTEXITCODE){throw 'Compatibility archive validation failed.'}

      - name: Compose and verify the official website
        run: |
          pnpm site:build
          pnpm site:check
          pnpm site:test
          pnpm site:licenses
          node scripts/compose-official-web.mjs --reference dist/reference-pages --legacy-reference dist/legacy-reference-pinned --legacy-mode sibling --out dist/official-site-current
          node scripts/check-official-site.mjs --out dist/official-site-current --legacy dist/legacy-reference-pinned --reference dist/reference-pages
          node scripts/check-official-site-pairing.mjs dist/official-site-current

      - name: Upload public reference Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/official-site-current
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy and verify public reference Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published reference Pages
        env:
          HIA_REFERENCE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          HIA_REFERENCE_EXPECTED_COMMIT: ${{ github.sha }}
          HIA_REFERENCE_EXPECTED_ROOT: official
        run: node scripts/check-reference-pages-online.mjs
