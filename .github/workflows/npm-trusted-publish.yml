name: npm Trusted Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select which release path to run
        type: choice
        required: true
        default: stable
        options:
          - stable
          - candidate-audit
          - candidate-publish
      package_name:
        description: "Candidate package name, for example @hia-doc/core"
        required: false
        type: string
      confirm_publish:
        description: "Type: publish @hia-doc package"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package with npm provenance
    if: inputs.operation == 'stable' && inputs.package_name != '' && inputs.confirm_publish == 'publish @hia-doc package'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate

      - name: Install npm trusted publishing baseline
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm run release:gate:publish-ready

      - name: Resolve package
        id: resolve
        env:
          FORMAL_PACKAGE: ${{ inputs.package_name }}
        run: node scripts/resolve-public-release-package.mjs "$FORMAL_PACKAGE" --publish-ready --github-output

      - name: Pack package through pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/hia-pack"
          pnpm --filter "${{ steps.resolve.outputs.package_name }}" pack --pack-destination "$RUNNER_TEMP/hia-pack"
          ls -la "$RUNNER_TEMP/hia-pack"

      - name: Publish package tarball
        # 中文：记录工具版本及OIDC交换结果，避免最终PUT错误掩盖认证原因；不输出环境变量或原始调试文件。
        # English: Record tool versions and OIDC exchange outcomes so a final PUT error cannot hide authentication failures; never dump environment variables or raw debug files.
        run: |
          node --version
          npm --version
          npm publish "$RUNNER_TEMP"/hia-pack/*.tgz --access public --provenance --registry=https://registry.npmjs.org/ --loglevel=verbose

  candidate:
    # <lang lang="zh-CN">只使用全局已核对的归档和审批入口。</lang><lang lang="en">Use the coordinated verified archive and approval path.</lang>
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'candidate-audit' || inputs.operation == 'candidate-publish')
    uses: mandolin/HIA-Documentation/.github/workflows/publish-npm-candidate.yml@bc2b83b76ba40bd599892f83e629ed5b73fc7200
    with:
      release_revision: bc2b83b76ba40bd599892f83e629ed5b73fc7200
      mode: ${{ inputs.operation == 'candidate-audit' && 'audit' || 'publish' }}
      package_name: ${{ inputs.package_name }}
      confirmation: ${{ inputs.confirm_publish }}
    secrets:
      bootstrap_token: ${{ secrets.HIA_NPM_BOOTSTRAP_TOKEN }}
